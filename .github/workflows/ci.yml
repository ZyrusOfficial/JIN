name: CI

on:
  push:
    branches: [main, arena/*]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run make check
        run: make check

      - name: Run make check-fast
        run: make check-fast

      - name: Secret scan
        run: |
          python -m pip install truffleHog || true
          echo "Secret scanning placeholder — integrate truffleHog or gitleaks"
